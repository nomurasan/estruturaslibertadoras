<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Strategy Knotworking: 6 interconnected core questions forming an adaptive continuous weaving knot -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagonal Knot Ribbon (weaving continuously) -->
    <!-- 6 Core Question Nodes arranged in an organic loop -->
    <!-- Node 1: Purpose (Top) -->
    <circle cx="50" cy="18" r="6" stroke-width="3" fill="#ffffff" />
    <circle cx="50" cy="18" r="2.5" fill="#000000" />

    <!-- Node 2: Context (Top Right) -->
    <circle cx="78" cy="34" r="5" stroke-width="3" fill="#ffffff" />

    <!-- Node 3: Challenges (Bottom Right) -->
    <circle cx="78" cy="66" r="5" stroke-width="3" fill="#ffffff" />

    <!-- Node 4: Baseline Action (Bottom) -->
    <circle cx="50" cy="82" r="5" stroke-width="3" fill="#ffffff" />

    <!-- Node 5: Immediate Next Steps (Bottom Left) -->
    <circle cx="22" cy="66" r="5" stroke-width="3" fill="#ffffff" />

    <!-- Node 6: Evaluation & Learning (Top Left) -->
    <circle cx="22" cy="34" r="5" stroke-width="3" fill="#ffffff" />

    <!-- Interlaced Knotweaving Lines -->
    <!-- Loop 1 -->
    <path d="M50 24 C50 36, 68 50, 78 61" stroke-width="3.5" />
    <path d="M78 71 C68 76, 58 76, 50 77" stroke-width="3.5" />
    <path d="M45 80 C36 78, 28 72, 22 61" stroke-width="3.5" />
    <path d="M22 61 C26 46, 42 32, 50 24" stroke-width="3.5" />

    <!-- Loop 2 (Interlocking Triquetra / Knot weave) -->
    <path d="M78 39 C72 52, 54 66, 45 80" stroke-width="3.5" />
    <path d="M27 34 C40 38, 62 38, 73 34" stroke-width="3" stroke-dasharray="3 3" />
    <path d="M22 39 C30 52, 46 64, 55 80" stroke-width="3" stroke-dasharray="3 3" />
    
    <!-- Central Weave / Center Knot Star -->
    <circle cx="50" cy="50" r="4" fill="#000000" />
    <!-- Dynamic weaving lines through center -->
    <path d="M38 50 L62 50" stroke-width="2.5" />
    <path d="M44 40 L56 60" stroke-width="2.5" />
    <path d="M56 40 L44 60" stroke-width="2.5" />
  </g>
</svg>
