<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Future~Present: Looking back from the distant future (star/telescope) to seed the present moment -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Present moment (Seed / sprouting seedling in the hand on the left) -->
    <path d="M16 78 C24 76, 32 76, 38 80" stroke-width="3" />
    <path d="M26 77 C26 68, 27 60, 27 52" stroke-width="3" />
    <!-- Seedling leaves in present -->
    <path d="M27 60 C20 56, 18 48, 26 50" stroke-width="2.5" fill="#000000" />
    <path d="M27 54 C34 50, 36 42, 28 44" stroke-width="2.5" fill="#000000" />
    <circle cx="27" cy="77" r="3" fill="#000000" />

    <!-- Distant Future (2045+ Polaris / Bright Star on the top right) -->
    <path d="M78 18 L78 34 M70 26 L86 26" stroke-width="3.5" />
    <path d="M72 20 L84 32 M72 32 L84 20" stroke-width="2.5" />
    <circle cx="78" cy="26" r="3" fill="#000000" />

    <!-- Backcasting Arc: Arrow travelling BACKWARDS from future to present -->
    <path d="M74 34 C64 52, 46 56, 32 58" stroke-width="3.5" stroke-dasharray="4 4" />
    <!-- Backward arrowhead at the present end -->
    <path d="M38 52 L30 58 L38 64" stroke-width="3.5" stroke-linejoin="miter" />

    <!-- Campfire storytelling circle (Elders & Youth below) -->
    <path d="M52 82 C56 74, 60 74, 64 82" stroke-width="3" /> <!-- flame -->
    <circle cx="58" cy="74" r="2" fill="#000000" />
    <path d="M46 86 L70 86" stroke-width="2.5" /> <!-- wood logs -->

    <!-- Observer / Youth looking ahead and Elder pointing back -->
    <circle cx="44" cy="68" r="3" fill="#000000" />
    <circle cx="72" cy="68" r="3" fill="#000000" />
  </g>
</svg>
