<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Grief Walking: Two human figures walking side by side peacefully, one supporting with quiet presence -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gentle horizon / ground line -->
    <path d="M10 82 C35 80, 65 80, 90 82" stroke-width="3" />
    
    <!-- Left Person (The one processing loss, head gently bowed) -->
    <circle cx="36" cy="34" r="5.5" fill="#000000" />
    <path d="M36 40 L34 56 L28 78" stroke-width="3.5" />
    <path d="M34 56 L38 78" stroke-width="3.5" />
    <!-- Arms crossed / close to heart -->
    <path d="M35 46 C32 50, 36 54, 38 52" stroke-width="3" />

    <!-- Right Person (Companion walking alongside, offering quiet empathy) -->
    <circle cx="56" cy="32" r="5.5" stroke-width="3" fill="#ffffff" />
    <path d="M56 38 L57 56 L52 78" stroke-width="3.5" />
    <path d="M57 56 L62 78" stroke-width="3.5" />
    <!-- Gentle arm extending near companion without crowding -->
    <path d="M54 44 C48 48, 44 48, 40 48" stroke-width="2.5" stroke-dasharray="2 3" />

    <!-- Symbolic fallen leaf / transition element floating down gently -->
    <path d="M74 42 C78 36, 84 38, 82 46 C78 52, 70 48, 74 42 Z" stroke-width="2.5" />
    <line x1="74" y1="42" x2="80" y2="48" stroke-width="2" />

    <!-- Gentle supportive aura / calm breeze -->
    <path d="M18 28 C28 26, 36 28, 42 26" stroke-width="2" stroke-dasharray="3 4" />
  </g>
</svg>
