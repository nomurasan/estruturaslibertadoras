<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Network Relationship Patterns: Visualizing organic clusters, bridges, silos, and emergent bonds -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Network Cluster A (Left) -->
    <line x1="24" y1="30" x2="38" y2="44" stroke-width="2.5" />
    <line x1="24" y1="30" x2="18" y2="52" stroke-width="2.5" />
    <line x1="38" y1="44" x2="18" y2="52" stroke-width="2.5" />
    <line x1="18" y1="52" x2="28" y2="72" stroke-width="2" />
    <line x1="38" y1="44" x2="28" y2="72" stroke-width="2.5" />

    <!-- Network Cluster B (Right) -->
    <line x1="66" y1="28" x2="82" y2="38" stroke-width="2.5" />
    <line x1="66" y1="28" x2="74" y2="56" stroke-width="2.5" />
    <line x1="82" y1="38" x2="74" y2="56" stroke-width="2.5" />
    <line x1="74" y1="56" x2="84" y2="74" stroke-width="2" />

    <!-- Central Strategic Bridge linking both clusters -->
    <line x1="38" y1="44" x2="52" y2="48" stroke-width="3.5" />
    <line x1="52" y1="48" x2="74" y2="56" stroke-width="3.5" />
    <line x1="52" y1="48" x2="50" y2="24" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Nodes (circles of varying influence/hub size) -->
    <circle cx="24" cy="30" r="4" fill="#000000" />
    <circle cx="38" cy="44" r="6" fill="#ffffff" stroke-width="3" />
    <circle cx="18" cy="52" r="4.5" fill="#000000" />
    <circle cx="28" cy="72" r="3.5" fill="#000000" />

    <!-- Central Hub / Broker Node -->
    <circle cx="52" cy="48" r="7" fill="#000000" />
    <circle cx="50" cy="24" r="3" fill="#000000" />

    <circle cx="66" cy="28" r="4" fill="#000000" />
    <circle cx="82" cy="38" r="4" fill="#000000" />
    <circle cx="74" cy="56" r="6" fill="#ffffff" stroke-width="3" />
    <circle cx="84" cy="74" r="3.5" fill="#000000" />

    <!-- Emergent connection arrow below -->
    <path d="M28 72 C50 86, 68 86, 84 74" stroke-width="2" stroke-dasharray="3 4" />
  </g>
</svg>
