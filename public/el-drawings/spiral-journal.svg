<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Spiral Journal: The iconic 4 quadrants and the meditative hand-drawn continuous spiral -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Quadrant Box -->
    <rect x="14" y="14" width="72" height="72" rx="6" stroke-width="3.5" />
    <line x1="50" y1="14" x2="50" y2="86" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="14" y1="50" x2="86" y2="50" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Meditative Expanding Spiral in Center -->
    <path d="M50 50 
             A 2.5 2.5 0 0 1 52.5 50 
             A 5 5 0 0 1 47.5 50 
             A 8 8 0 0 1 55.5 50 
             A 12 12 0 0 1 44 50 
             A 16 16 0 0 1 60 50 
             A 21 21 0 0 1 39 50 
             A 27 27 0 0 1 66 50 
             A 33 33 0 0 1 33 50" 
          stroke-width="3.5" />

    <!-- Pen / pencil tip at spiral origin -->
    <circle cx="50" cy="50" r="2.5" fill="#000000" />
    
    <!-- Quadrant Prompt Indicators -->
    <circle cx="24" cy="24" r="3" fill="#000000" />
    <circle cx="76" cy="24" r="3" fill="#000000" />
    <circle cx="24" cy="76" r="3" fill="#000000" />
    <circle cx="76" cy="76" r="3" fill="#000000" />
  </g>
</svg>
